name: Test Flutter iOS Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  swiftpm:
    name: build (swiftpm)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Get dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example app (Simulator, Debug)
        working-directory: example
        run: flutter build ios --simulator --debug 2>&1 | tee build.log

      - name: Assert plugin is integrated via Swift Package Manager
        working-directory: example
        run: |
          if grep -Eq "do not support Swift Package Manager|does not have Swift Package Manager support" build.log; then
            echo "::error::rx_connectivity_checker was not integrated via Swift Package Manager"
            exit 1
          fi

      - name: Run integration smoke test (simulator)
        working-directory: example
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"

  # The example app is migrated to Swift Package Manager, and a migrated plugin
  # example cannot be built with CocoaPods. A fresh app that depends on the
  # plugin by path exercises the podspec the way CocoaPods users consume it.
  cocoapods:
    name: build (cocoapods)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Create CocoaPods consumer app
        working-directory: ${{ runner.temp }}
        run: |
          flutter create --platforms=ios --project-name cocoapods_consumer cocoapods_consumer
          cd cocoapods_consumer
          flutter pub add "rx_connectivity_checker:{\"path\":\"$GITHUB_WORKSPACE\"}"

      - name: Build consumer app (Simulator, Debug)
        working-directory: ${{ runner.temp }}/cocoapods_consumer
        run: flutter build ios --simulator --debug

      - name: Assert plugin is integrated via CocoaPods
        working-directory: ${{ runner.temp }}/cocoapods_consumer
        run: |
          if ! grep -q "rx_connectivity_checker" ios/Podfile.lock; then
            echo "::error::rx_connectivity_checker was not integrated via CocoaPods"
            exit 1
          fi
