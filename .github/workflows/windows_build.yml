name: Windows Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Enable long paths (needed for Windows)
      - name: Enable long paths
        run: git config --system core.longpaths true

      # 3️⃣ Setup MSVC / C++ toolchain
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # 4️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.13.10' # Ensure Windows plugin support
          cache: true

      # 5️⃣ Flutter doctor for debugging
      - name: Flutter Doctor
        run: flutter doctor -v

      # ---- Root package ----
      - name: Pub Get (root)
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # ---- Example app ----
      - name: Pub Get (example)
        working-directory: example
        run: flutter pub get

      - name: Clean Windows build
        working-directory: example
        run: flutter clean

      - name: Pub Get (example, after clean)
        working-directory: example
        run: flutter pub get

      - name: Build Windows Example
        working-directory: example
        run: flutter build windows --release
