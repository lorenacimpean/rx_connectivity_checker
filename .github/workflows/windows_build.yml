name: Test Flutter Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Precache Windows
        run: flutter precache --windows

      - name: Get dependencies (example app)
        working-directory: example
        run: flutter pub get

      # Install CppWinRT (required by plugin)
      - name: Install CppWinRT
        shell: pwsh
        run: |
          nuget install Microsoft.Windows.CppWinRT -Version 2.0.230706.1 -OutputDirectory $env:GITHUB_WORKSPACE

      - name: Set CppWinRT_DIR
        shell: pwsh
        run: |
          $path = "$env:GITHUB_WORKSPACE\Microsoft.Windows.CppWinRT.2.0.230706.1\build\native"
          echo "CppWinRT_DIR=$path" >> $env:GITHUB_ENV

      - name: Build Windows (Release)
        working-directory: example
        run: flutter build windows --release
