name: rx_connectivity_checker
description: "A robust, reactive Dart/Flutter package for monitoring network connectivity."
version: 1.0.0
repository: https://github.com/lorenacimpean/rx_connectivity_checker

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core dependencies for the hybrid logic
  http: ^1.6.0
  plugin_platform_interface: ^2.1.8
  rxdart: ^0.28.0
  # Web & Desktop logic dependencies
  web: ^1.1.1
  flutter_web_plugins:
    sdk: flutter
  # Required for the Dart-based Linux implementation
  dbus: ^0.7.11
  # Internal utility if required by your architecture
  project_starter_kit: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  coverage: ^1.15.0
  # Moved from dependencies to dev_dependencies (Clean Code / SoC)
  mocktail: ^1.0.4
  dev: ^1.0.0

flutter:
  plugin:
    platforms:
      # Mobile Platforms
      android:
        package: io.github.lorenacimpean.rx_connectivity_checker
        pluginClass: RxConnectivityCheckerPlugin
      ios:
        pluginClass: SwiftRxConnectivityCheckerPlugin
      macos:
        pluginClass: SwiftRxConnectivityCheckerPlugin
      windows:
        pluginClass: RxConnectivityCheckerPluginCApi
      linux:
        dartPluginClass: src/LinuxRxConnectivityChecker
      web:
        fileName: src/web_rx_connectivity_checker.dart
        pluginClass: WebRxConnectivityChecker